<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Wall Editor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23a3e635'/><text x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='16' fill='%2309090b'>W</text></svg>" />
  <script src="https://cdn.tailwindcss.com/3.4.1?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--font-sans)', 'sans-serif'],
            serif: ['var(--font-serif)', 'serif']
          },
          colors: {
            'bg-main': 'var(--color-bg-main)',
            'text-main': 'var(--color-text-main)',
            'text-muted': 'var(--color-text-muted)'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: '"Playfair Display", Georgia, serif';
    }
    body {
      margin: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input[type='range'] {
      accent-color: #a3e635;
    }
    .we-scroll::-webkit-scrollbar { width: 6px; }
    .we-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 999px; }
    .we-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="wall-editor-root"></div>
  <script type="module" src="/src/dev/wallEditorMain.tsx"></script>
</body>
</html>
