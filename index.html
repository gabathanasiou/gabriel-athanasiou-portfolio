<!DOCTYPE html>
<html lang="en" class="__HTML_CLASS__">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="__COLOR_SCHEME__">
    <meta name="theme-color" content="__THEME_COLOR__">

    <!-- SEO Meta Tags (generated per portfolio mode in vite.config.ts) -->
    <title>__SITE_TITLE__</title>
    <meta name="description" content="__SITE_DESCRIPTION__">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta property="og:site_name" content="__SITE_NAME__">
    <meta property="og:title" content="__SITE_TITLE__">
    <meta property="og:description" content="__SITE_DESCRIPTION__">
    <meta property="og:type" content="website">
    <meta property="og:image" content="__OG_IMAGE__">
    <meta property="og:url" content="__SITE_URL__">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="__SITE_TITLE__">
    <meta name="twitter:description" content="__SITE_DESCRIPTION__">
    <meta name="twitter:image" content="__OG_IMAGE__">
    <meta name="twitter:creator" content="@gab_ath">

    <!-- Canonical URL -->
    <link rel="canonical" href="__SITE_URL__">

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%23fff'>GA</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23050505' width='180' height='180'/><text x='50%' y='50%' dy='.3em' font-size='80' font-weight='bold' fill='%23fff' text-anchor='middle' dominant-baseline='middle'>GA</dominant-baseline></text></svg>">

    <!-- Tailwind is compiled at build time (see tailwind.config.js / src/index.css) -->

    <!-- Third-party origins used by the data and image pipeline -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- Fonts: generated per portfolio mode in vite.config.ts, loaded without blocking -->
    __FONT_LINKS__

    <!-- Cloudinary Configuration -->
    <script>
        // Inject Cloudinary config for client-side image optimization
        window.USE_CLOUDINARY = 'true';
        window.CLOUDINARY_CLOUD_NAME = 'date24ay6';
    </script>

    <style>
        html {
            scroll-behavior: smooth;
            overflow-y: scroll; /* Always show scrollbar to prevent layout jumps */
            --scrollbar-thumb: #666666;
            --scrollbar-track: #050505;
            /* Standard scrollbar styling; the WebKit fallback lives below. */
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
            scrollbar-width: thin;
        }
        html.light-theme {
            --scrollbar-thumb: #767676;
            --scrollbar-track: #f0f0f0;
        }
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
        @supports not (scrollbar-color: auto) {
            html {
                /* Reset thin so ::-webkit-scrollbar styling is not suppressed. */
                scrollbar-width: auto;
            }
            ::-webkit-scrollbar {
                width: 6px;
                background: var(--scrollbar-track);
            }
            ::-webkit-scrollbar-thumb {
                background: var(--scrollbar-thumb);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #888888;
            }
        }
        body {
            background-color: #050505; /* Fallback */
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        html.light-theme body {
            background-color: #ffffff;
            color: #1a1a1a;
        }

        /* SCROLLBAR — hiding helper */
        .no-scrollbar {
            scrollbar-width: none;
        }
        @supports not (scrollbar-color: auto) {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
        }

        /* Utility for blend modes */
        .blend-text {
            mix-blend-mode: difference;
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
