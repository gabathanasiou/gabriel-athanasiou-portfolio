[build]
# Build command uses custom script that reads PORTFOLIO_MODE environment variable
# For directing site: set PORTFOLIO_MODE=directing in Netlify env vars
# For postprod site: set PORTFOLIO_MODE=postproduction in Netlify env vars
command = "bash scripts/netlify-build.sh"
functions = "netlify/functions"
publish = "dist"
# Build optimization: Only build production branch and deploy previews
# Feature branches will not auto-build unless you enable them specifically
ignore = "bash scripts/ignore-netlify-build.sh"

# Configure functions to include sharp for image processing
[functions]
  node_bundler = "esbuild"
  # Don't bundle sharp - let it run as external
  external_node_modules = ["sharp", "@img/sharp-linux-x64", "@img/sharp-libvips-linux-x64"]

# Enable Netlify Blobs and KV storage
[context.production]
  [context.production.environment]
    NETLIFY_BLOBS_CONTEXT = "production"

# Cache optimized images between builds
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["dist/images/portfolio", "public/images/portfolio"]

# Browser caching for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Allow CORS for cloudinary-mapping.json (used by Instagram Studio)
[[headers]]
  for = "/cloudinary-mapping.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[dev]
command = "npm run dev:vite"
targetPort = 3000
port = 8888
autoLaunch = false


# Optional agent files should 404 rather than return the SPA shell.
[[redirects]]
from = "/.well-known/*"
to = "/404.html"
status = 404

# SPA fallback - the edge function will intercept specific routes via its config export
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security headers for every response.
# CSP starts report-only so violations are visible before enforcement.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com https://img.youtube.com https://i.vimeocdn.com https://www.google-analytics.com; media-src 'self' https://res.cloudinary.com; connect-src 'self' https://cdn.jsdelivr.net https://vimeo.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src https://www.youtube.com https://player.vimeo.com; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
